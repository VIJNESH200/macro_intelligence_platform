[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-intelligence-platform"
version = "2.5.0"
description = "Institutional Macroeconomic Cycle Tracing & Forecasting Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vijnesh"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "yfinance>=0.2.18",
    "pandas-datareader>=0.10.0",
    "sdmx1>=2.17.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "certifi>=2024.2.2"
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.7.0",
    "reportlab>=4.0.0"
]
data = [
    "yfinance>=0.2.18",
    "pandas-datareader>=0.10.0",
    "sdmx1>=2.17.0",
    "beautifulsoup4>=4.12.0"
]
dev = [
    "flake8>=6.0.0"
]
all = [
    "matplotlib>=3.7.0",
    "reportlab>=4.0.0",
    "yfinance>=0.2.18",
    "pandas-datareader>=0.10.0",
    "sdmx1>=2.17.0",
    "beautifulsoup4>=4.12.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
