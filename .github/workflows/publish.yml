name: Weekly Forecast & GitHub Pages Publish

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export Latest Forecast JSON
        run: |
          python scripts/export_forecast.py --out docs/latest_forecast.json

      - name: Append to Live Track Record Ledger
        run: |
          python scripts/append_ledger.py --json docs/latest_forecast.json --ledger docs/live_track_record.csv

      - name: Back-fill Realized Outcomes
        run: |
          python scripts/backfill_realized.py --ledger docs/live_track_record.csv

      - name: Generate Static HTML Dashboard
        run: |
          python scripts/generate_site.py --json docs/latest_forecast.json --out docs/index.html

      - name: Commit and Push Ledger to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/live_track_record.csv docs/latest_forecast.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ledger): update live track record [skip ci]" && git push)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
