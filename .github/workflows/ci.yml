name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e .

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run unit test suite
      run: |
        python -m unittest discover -s tests

    - name: Run backtest benchmark validation
      run: |
        # Ensure the quantitative engine operates correctly without GUI dependencies
        python tests/backtest_benchmarks.py

    - name: Validate Quickstart Notebook Execution
      run: |
        # Verify notebook code execution from notebooks/ subfolder
        python -c "import os, sys, json; os.chdir('notebooks'); code = '\n'.join(['\n'.join(c['source']) for c in json.load(open('quickstart.ipynb'))['cells'] if c['cell_type'] == 'code']); exec(code)"

